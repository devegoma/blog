name: Issue 70 Pages preflight

on:
    push:
        branches: [codex/issue-70-preflight]

permissions:
    contents: read

jobs:
    preflight:
        name: Read registered Pages project
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
            - name: Confirm project using registered Secrets
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: node scripts/check-pages-project.mjs
            - uses: actions/upload-artifact@v7
              with:
                  name: issue-70-project-${{ github.run_attempt }}
                  path: test-results/issue70-project.json
                  retention-days: 7
                  if-no-files-found: error
