version: 2
updates:
    - package-ecosystem: npm
      directory: /
      target-branch: develop
      ignore:
          - dependency-name: "@types/node"
            update-types: ["version-update:semver-major"]
      schedule:
          interval: weekly
          day: monday
          time: "09:00"
          timezone: Asia/Tokyo
      groups:
          minor-and-patch:
              update-types: [minor, patch]
    - package-ecosystem: github-actions
      directory: /
      target-branch: develop
      schedule:
          interval: weekly
          day: monday
          time: "09:00"
          timezone: Asia/Tokyo
      groups:
          minor-and-patch:
              update-types: [minor, patch]
